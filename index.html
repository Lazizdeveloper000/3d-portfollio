<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mainframe®</title>
<style>
  :root{
    --red:#c81c0a;          /* videodagi fon rangi bilan bir xil */
    --red-dark:#9c1406;
    --fg:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    color:var(--fg);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;user-select:none;
    background:
      radial-gradient(120% 90% at 85% 40%, var(--red) 0%, var(--red) 45%, var(--red-dark) 100%);
  }
  a{color:inherit;text-decoration:none}

  /* ---------- video: o'ng tomonda, katta, chetlari fon bilan qo'shilib ketadi ---------- */
  .stage{
    position:fixed;z-index:0;bottom:0;right:2vw;
    height:100vh;height:100dvh;aspect-ratio:9/16;
    -webkit-mask-image:
      linear-gradient(to right,transparent 0,#000 22%,#000 78%,transparent 100%),
      linear-gradient(to bottom,transparent 0,#000 14%);
    -webkit-mask-composite:source-in;
    mask-image:
      linear-gradient(to right,transparent 0,#000 22%,#000 78%,transparent 100%),
      linear-gradient(to bottom,transparent 0,#000 14%);
    mask-composite:intersect;
    pointer-events:none;
  }
  .stage video{width:100%;height:100%;object-fit:cover;display:block}

  /* telefon: video butun ekranga */
  @media(max-width:819px){
    .stage{right:0;left:0;width:100%;aspect-ratio:auto;-webkit-mask-image:none;mask-image:none}
  }

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 28px;
  }
  .logo{font-size:24px;letter-spacing:-.02em}
  .logo span{margin-left:8px}
  nav,.cta{display:none;font-size:20px}
  nav a,.cta{transition:opacity .2s}
  nav a:hover,.cta:hover{opacity:.6}
  .cta{text-decoration:underline;text-underline-offset:3px}
  @media(min-width:820px){nav,.cta{display:block}}

  /* ---------- matn (chapda) ---------- */
  .copy{
    position:fixed;z-index:3;left:0;
    max-width:560px;padding:0 28px;
    top:50%;transform:translateY(-50%);
  }
  @media(max-width:819px){
    .copy{top:auto;bottom:0;transform:none;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 34px)}
  }
  .intro{
    font-size:clamp(16px,2.2vw,22px);line-height:1.3;margin:0 0 22px;
    filter:blur(4px);pointer-events:none;
  }
  #t{
    font-size:clamp(20px,2.6vw,30px);line-height:1.3;letter-spacing:-.01em;
    margin:0 0 22px;min-height:3em;
    text-shadow:0 2px 18px rgba(0,0,0,.25);
  }
  .cur{
    display:inline-block;width:2px;height:1em;background:#fff;
    vertical-align:-.12em;margin-left:3px;animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .pills{
    display:flex;flex-wrap:wrap;gap:8px;
    opacity:0;transform:translateY(8px);
    transition:opacity .5s,transform .5s;
  }
  .pills.on{opacity:1;transform:none}
  button{
    font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;
    padding:7px 18px;border-radius:999px;
    background:#fff;color:#000;border:1px solid rgba(0,0,0,.1);
    transition:background .2s,color .2s,border-color .2s;
  }
  button:hover{background:#000;color:#fff}
  button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.85)}
  button.ghost:hover{background:#fff;color:#000}

  .hint{
    position:fixed;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);
    font-size:12px;opacity:.6;letter-spacing:.04em;transition:opacity .6s;
  }
  @media(max-width:819px){.hint{display:none}}
</style>
</head>
<body>

<div class="stage">
  <!-- scrub.mp4 shu HTML bilan bir papkada bo'lsin -->
  <video id="v" src="video_2026-11-14_22-12-00.mp4" muted playsinline preload="auto"></video>
</div>

<header>
  <a class="logo" href="#">Mainframe®<span>✳︎</span></a>
  <nav><a href="#labs">Labs</a>, <a href="#studio">Studio</a>, <a href="#openings">Openings</a>, <a href="#shop">Shop</a></nav>
  <a class="cta" href="#contact">Get in touch</a>
</header>

<section class="copy">
  <div class="intro" aria-hidden="true">Hey there, meet A.R.I.A,<br>Mainframe's Adaptive Response Interface Agent</div>
  <p id="t"></p>
  <div class="pills" id="pills">
    <button>Pitch us an idea</button>
    <button>Come work here</button>
    <button>Send a brief hello</button>
    <button>See how we operate</button>
    <button class="ghost" id="mail">Reach us: <u>hello@mainframe.co</u></button>
  </div>
</section>

<div class="hint" id="hint">Sichqonchani suring ↔</div>

<script>
  /* ---- mouse scrub: sichqoncha qayerda bo'lsa, bosh shu tomonga buriladi ---- */
  const v = document.getElementById('v');
  const EASE = 0.12;               // kichik = silliqroq, katta = tezroq
  let target = 0, cur = 0, seeking = false, ready = false;

  function setFrom(x){
    if(!v.duration) return;
    target = Math.min(1, Math.max(0, x / innerWidth)) * v.duration;
  }
  v.addEventListener('loadedmetadata', () => {
    ready = true; target = cur = v.duration / 2; v.currentTime = cur;
  });
  v.addEventListener('seeked', () => { seeking = false; });

  addEventListener('mousemove',  e => setFrom(e.clientX));
  addEventListener('touchstart', e => setFrom(e.touches[0].clientX), {passive:true});
  addEventListener('touchmove',  e => setFrom(e.touches[0].clientX), {passive:true});

  (function loop(){
    if(ready){
      cur += (target - cur) * EASE;
      if(!seeking && Math.abs(v.currentTime - cur) > 0.005){
        seeking = true; v.currentTime = cur;
      }
    }
    requestAnimationFrame(loop);
  })();

  /* ---- typewriter ---- */
  const text = 'Glad you stopped in. Good taste tends to find us. Now, what are we building?';
  const t = document.getElementById('t');
  let i = 0;
  setTimeout(() => {
    const id = setInterval(() => {
      i++;
      t.textContent = text.slice(0, i);
      if(i < text.length) t.insertAdjacentHTML('beforeend','<span class="cur"></span>');
      else clearInterval(id);
    }, 38);
  }, 600);
  setTimeout(() => document.getElementById('pills').classList.add('on'), 400);

  /* ---- email copy ---- */
  const mail = document.getElementById('mail');
  mail.onclick = async () => {
    try { await navigator.clipboard.writeText('hello@mainframe.co'); } catch(e){}
    const old = mail.innerHTML;
    mail.textContent = 'Copied ✓';
    setTimeout(() => mail.innerHTML = old, 1800);
  };

  setTimeout(() => document.getElementById('hint').style.opacity = 0, 6000);
</script>
</body>
</html>
